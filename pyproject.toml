[project]
name = "poor-richard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "brian-learns", email = "epitome-tampers.1v@icloud.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ambiance>=1.3.1",
    "astral>=3.2",
    "astropy>=8.0.1",
    "babel>=2.18.0",
    "biopython>=1.88",
    "bizdays>=1.0.19",
    "charset-normalizer>=3.5.1",
    "chemformula>=1.5.1",
    "chemicals>=1.5.2",
    "colour-science>=0.4.7",
    "convertdate>=2.4.1",
    "countryinfo>=1.0.1",
    "czml3>=3.3.1",
    "email-validator>=2.3.0",
    "ephem>=4.2.1",
    "filetype>=1.2.0",
    "geographiclib>=2.1",
    "h3>=4.5.0",
    "holidays>=0.104",
    "icalendar>=7.3.0",
    "idna>=3.19",
    "iso4217>=1.16.20260101",
    "isodate>=0.7.2",
    "lunardate>=0.3.0",
    "mido>=1.3.3",
    "mimeparse>=0.1.3",
    "molmass>=2026.1.8",
    "networkx>=3.6.1",
    "pandas-market-calendars>=4.6.1",
    "particle>=1.0.0",
    "periodictable>=2.1.0",
    "phonenumbers>=9.0.38",
    "pint>=0.25.3",
    "pycountry>=26.2.16",
    "pymeeus>=0.5.12",
    "pyproj>=3.7.2",
    "pysweph>=2.10.3.6",
    "python-dateutil>=2.9.0.post0",
    "python-iso639>=2026.7.23",
    "python-magic>=0.4.27",
    "python-stdnum>=2.2",
    "scipy>=1.17.1",
    "sgp4>=2.27",
    "shapely>=2.1.2",
    "skyfield>=1.55",
    "starfile>=0.5.13",
    "timezonefinder>=8.3.0",
    "tldextract>=5.3.2",
    "uncertainties>=3.2.3",
    "unidecode>=1.4.0",
    "uniseg>=0.10.1",
    "user-agents>=2.2.0",
    "workalendar>=17.0.0",
]

[project.optional-dependencies]
# Heavier cards: financedatabase needs a one-time data fetch, pypostal-multiarch
# needs a system libpostal to build (3.13+) or find its data. Base install
# works everywhere; these make the full test suite runnable.
full = [
    "financedatabase>=2.4.0",
    "pypostal-multiarch>=1.0.3",
]

[project.scripts]
poor-richard = "poor_richard:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pipdeptree>=4.2.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# tests live inside the package so the wheel ships them (for --example)
testpaths = ["src/poor_richard/tests"]
