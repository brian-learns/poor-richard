name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Base install only: the 'full' extra (financedatabase, pypostal-multiarch)
      # is skipped on runners — pypostal needs a system libpostal, and the
      # financedatabase data fetch is not worth it here. Those tests skip.
      - name: Install
        run: uv sync --frozen --python ${{ matrix.python }}
      # --no-sync: the Install step already synced; a re-sync would also
      # re-resolve the interpreter from .python-version and clobber the env.
      - name: Test
        run: uv run --frozen --no-sync pytest
