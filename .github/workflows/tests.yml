name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # pypostal-multiarch needs a system libpostal to build (sdist) or find
      # its data (wheels bundle a libpostal with a foreign data path), which
      # runners don't have — skip it everywhere; the postal tests skip without it.
      - name: Install
        run: uv sync --frozen --python ${{ matrix.python }} --no-install-package pypostal-multiarch
      # --no-sync: the Install step already synced; a re-sync would also
      # re-resolve the interpreter from .python-version and clobber the env.
      # Data lives in the venv's site-packages; fetch it so test_financedatabase runs.
      - name: Fetch financedatabase data
        run: uv run --frozen --no-sync python scripts/fetch_financedatabase.py
      - name: Test
        run: uv run --frozen --no-sync pytest
